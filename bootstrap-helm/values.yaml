argocd:
  # gloabl enable/disable flag this helm chart
  enabled: true

  clusters:
    # flags for appsets in region01
    region01:
      helmValuesFile: values-region01.yaml
      selector:
        matchLabels:
          type: "supervisor"     
          env: "dev"
          namespace: "vks-clusters-mfm9f"
          region: "region01"

      vksdev01:
        helmValuesFile: values-region01.yaml
        selector:
          matchLabels:
            type: "vks"     
            env: "dev"
            namespace: "vks-clusters-mfm9f"
            name: "dev01"
            region: "region01"

  # application set flags
  applicationset:
    bootstrap:
      clusters:
        enable: true
        namespace: argocd-8xshq   # must match the namespace where the argocd instance resides
        project: default
        git:
          repoURL: https://github.com/amayacitta/vcf-argocd.git
          path: vks-clusters/*
          targetRevision: HEAD
      platform:
        enable: true
        namespace: argocd-8xshq   # must match the namespace where the argocd instance resides
        project: default
        git:
          repoURL: https://github.com/amayacitta/vcf-argocd.git
          path: vks-platform/*
          targetRevision: HEAD
      apps:
        enable: false
        namespace: argocd-8xshq   # must match the namespace where the argocd instance resides
        project: default
        git:
          repoURL: https://github.com/amayacitta/vcf-argocd.git
          path: vks-apps/*
          targetRevision: HEAD
      addons:
        enable: true
        namespace: argocd-8xshq   # must match the namespace where the argocd instance resides
        project: default
        git:
          repoURL: https://github.com/amayacitta/vcf-argocd.git
          path: vks-addons/*
          targetRevision: HEAD
