{{- if and .Values.argocd.enabled .Values.argocd.clusters.region01.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: vks-bootstrap-clusters
  namespace: {{ .Values.argocd.applicationset.bootstrap.clusters.namespace }}
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - matrix:
      generators:
        - git:
            repoURL: {{ .Values.argocd.applicationset.bootstrap.clusters.git.repoURL }}
            revision: {{ .Values.argocd.applicationset.bootstrap.clusters.git.targetRevision }}
            directories:
            - path: {{ .Values.argocd.applicationset.bootstrap.clusters.git.path }}
        - clusters:    
{{- with .Values.argocd.clusters.region01.selector }} 
            selector:
{{ toYaml . | indent 14 -}}
{{ end }}             
  template:      
    metadata:
      name: '{{ printf "{{ base (dir .path.path) }}-{{ base .path.path }}" }}'
    spec:
      project: {{ .Values.argocd.applicationset.bootstrap.clusters.project }}
      source:
        repoURL: {{ .Values.argocd.applicationset.bootstrap.clusters.git.repoURL }}
        targetRevision: {{ .Values.argocd.applicationset.bootstrap.clusters.git.targetRevision }}
        path: {{ printf "{{.path.path}}" | quote }}
        helm:
          valueFiles:
            - {{ .Values.argocd.clusters.region01.helmValuesFile }}
          releaseName: '{{ printf "{{ base (dir .path.path) }}" }}'
      destination:
        server: {{ printf "{{.server}}" | quote }}
        namespace: '{{ printf "{{ base (dir .path.path) }}" }}'
      syncPolicy:
        syncOptions:
        - CreateNamespace=false
        automated: 
          prune: true
          selfHeal: true
        retry:
          limit: 5 
          backoff:
            duration: 5s 
            factor: 2 
            maxDuration: 3m 
{{ end -}}