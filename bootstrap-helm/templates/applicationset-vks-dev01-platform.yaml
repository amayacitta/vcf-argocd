{{- if and .Values.argocd.enabled .Values.argocd.clusters.region01.vksdev01.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: vks-platform
  namespace: {{ .Values.argocd.applicationset.bootstrap.platform.namespace }}
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - matrix:
      generators:
        - git:
            repoURL: {{ .Values.argocd.applicationset.bootstrap.platform.git.repoURL }}
            revision: {{ .Values.argocd.applicationset.bootstrap.platform.git.targetRevision }}
            directories:
            - path: {{ .Values.argocd.applicationset.bootstrap.platform.git.path }}
        - clusters:    
{{- with .Values.argocd.clusters.region01.vksdev01.selector }} 
            selector:
{{ toYaml . | indent 14 -}}
{{ end }}             
  template:      
    metadata:
      name: '{{ printf "vks-clusters-dev-01-{{ base .path.path }}" }}'
    spec:
      project: {{ .Values.argocd.applicationset.bootstrap.platform.project }}
      source:
        repoURL: {{ .Values.argocd.applicationset.bootstrap.platform.git.repoURL }}
        targetRevision: {{ .Values.argocd.applicationset.bootstrap.platform.git.targetRevision }}
        path: {{ printf "{{.path.path}}" | quote }}
        helm:
          valueFiles:
            - {{ .Values.argocd.clusters.region01.vksdev01.helmValuesFile }}
          releaseName: '{{ printf "vks-cluster-dev-01-{{ base .path.path }}" }}'
      destination:
        server: {{ printf "{{.server}}" | quote }}
        namespace: '{{ printf "{{ base .path.path }}" }}'
      syncPolicy:
        syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
        automated: 
          prune: true
          selfHeal: true
        retry:
          limit: 5 
          backoff:
            duration: 5s 
            factor: 2 
            maxDuration: 3m 
{{ end -}}