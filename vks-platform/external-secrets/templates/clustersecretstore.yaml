{{- if .Values.chart.enabled }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vcfa-cluster-secret-store
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    vault:
      server: https://secret-store:8200
      # grab this from kubectl get secret server-cert -n svc-secret-store-rvlg5 -o jsonpath='{.data.ca\.crt}'
      caBundle: ""
      path: secret
      version: v2
      auth:
        kubernetes:
          # The mount path follows the pattern kubernetes-<supervisor_ns>-<cluster_name>
          mountPath: kubernetes-vks-clusters-mfm9f-dev-01
          # The role follows the pattern <supervisor_ns>-<cluster_name>
          role: vks-clusters-mfm9f-dev-01
          # The ServiceAccount ESO uses to authenticate
          serviceAccountRef:
            name: secret-store-sa
            namespace: external-secrets
{{ end -}}